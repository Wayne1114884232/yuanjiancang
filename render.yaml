services:
  - type: web
    name: component-hub-team
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: COMPONENT_DATA_DIR
        value: /app/data
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
    disk:
      name: component-hub-team-data
      mountPath: /app/data
      sizeGB: 1
