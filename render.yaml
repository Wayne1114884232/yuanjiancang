services:
  - type: web
    name: yuanjiancang
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: NODE_ENV
        value: production
